{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2 class="mb-4">Edit Stock Entry</h2>
    <form method="POST">
        <div class="row g-3">
            <div class="col-md-6">
                <label>Date</label>
                <input type="date" class="form-control" name="date" 
                       value="{{ stock.date.strftime('%Y-%m-%d') }}" required>
            </div>
            <div class="col-md-6">
                <label>Open Price</label>
                <input type="number" step="0.01" class="form-control" 
                       name="open" value="{{ stock.open }}" required>
            </div>
            <div class="col-md-6">
                <label>High Price</label>
                <input type="number" step="0.01" class="form-control" 
                       name="high" value="{{ stock.high }}" required>
            </div>
            <div class="col-md-6">
                <label>Low Price</label>
                <input type="number" step="0.01" class="form-control" 
                       name="low" value="{{ stock.low }}" required>
            </div>
            <div class="col-md-6">
                <label>Close Price</label>
                <input type="number" step="0.01" class="form-control" 
                       name="close" value="{{ stock.close }}" required>
            </div>
            <div class="col-md-6">
                <label>Volume</label>
                <input type="number" class="form-control" 
                       name="volume" value="{{ stock.volume }}" required>
            </div>
        </div>
        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Update Entry</button>
            <a href="{{ url_for('view_database') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
